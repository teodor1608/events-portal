<p-card header="Login" subheader="Use Google or email/password">
  <p-message *ngIf="errorMsg" severity="error" [text]="errorMsg"></p-message>

  <p-tabView>
    <p-tabPanel header="Google">
      <p>Redirect to Google login and come back signed in.</p>
      <p-divider></p-divider>
      <button
        pButton
        type="button"
        label="Continue with Google"
        icon="pi pi-google"
        (click)="loginWithGoogleRedirect()">
      </button>
    </p-tabPanel>

    <p-tabPanel header="Email Login">
      <div class="p-fluid">
        <label for="lemail">Email</label>
        <input id="lemail" pInputText type="email" [(ngModel)]="loginEmail" />

        <p-divider></p-divider>

        <label for="lpass">Password</label>
        <p-password id="lpass" [(ngModel)]="loginPassword" [feedback]="false" [toggleMask]="true"></p-password>

        <p-divider></p-divider>

        <button pButton type="button" label="Login" icon="pi pi-sign-in" (click)="loginLocal()"></button>
      </div>
    </p-tabPanel>

    <p-tabPanel header="Sign Up">
      <div class="p-fluid">
        <label for="semail">Email</label>
        <input id="semail" pInputText type="email" [(ngModel)]="signupEmail" />

        <p-divider></p-divider>

        <label for="spass1">Password</label>
        <p-password id="spass1" [(ngModel)]="signupPassword" [feedback]="true" [toggleMask]="true"></p-password>

        <p-divider></p-divider>

        <label for="spass2">Repeat Password</label>
        <p-password id="spass2" [(ngModel)]="signupPassword2" [feedback]="false" [toggleMask]="true"></p-password>

        <p-divider></p-divider>

        <button pButton type="button" label="Create Account" icon="pi pi-user-plus" (click)="signupLocal()"></button>
      </div>
    </p-tabPanel>
  </p-tabView>
</p-card>

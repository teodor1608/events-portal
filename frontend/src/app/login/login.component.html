<div class="auth-page">
  <p-card [header]="activeTab === 0 ? 'Login' : 'Register'" subheader="Sign in or create an account" class="auth-card">
    @if (errorMsg) {
      <p-message severity="error" [text]="errorMsg"></p-message>
    }

    <div class="tabs">
      <div class="tab-headers">
        <button pButton type="button" class="tab-btn" (click)="activeTab = 0" [attr.aria-pressed]="activeTab === 0 ? 'true' : 'false'">Login</button>
        <button pButton type="button" class="tab-btn" (click)="activeTab = 1" [attr.aria-pressed]="activeTab === 1 ? 'true' : 'false'">Register</button>
      </div>

      @if (activeTab === 0) {
        <div class="login-grid">
          <div class="login-google">
            <p>Sign in quickly with your Google account.</p>
            <button pButton type="button" label="Continue with Google" icon="pi pi-google" (click)="loginWithGoogleRedirect()" class="p-button-success"></button>
          </div>

          <p-divider></p-divider>

          <div class="p-fluid form-row">
            <label for="lemail">Email</label>
            <input id="lemail" pInputText type="email" [(ngModel)]="loginEmail" />

            <label for="lpass">Password</label>
            <p-password id="lpass" [(ngModel)]="loginPassword" [feedback]="false" [toggleMask]="true"></p-password>

            <button pButton type="button" label="Login" icon="pi pi-sign-in" (click)="loginLocal()"></button>
          </div>
        </div>
      }

      @if (activeTab === 1) {
        <div class="p-fluid form-row">
          <label for="semail">Email</label>
          <input id="semail" pInputText type="email" [(ngModel)]="signupEmail" />

          <label for="spass1">Password</label>
          <p-password id="spass1" [(ngModel)]="signupPassword" [feedback]="true" [toggleMask]="true"></p-password>

          <label for="spass2">Repeat Password</label>
          <p-password id="spass2" [(ngModel)]="signupPassword2" [feedback]="false" [toggleMask]="true"></p-password>

          <button pButton type="button" label="Create Account" icon="pi pi-user-plus" (click)="signupLocal()"></button>
        </div>
      }
    </div>
  </p-card>
</div>

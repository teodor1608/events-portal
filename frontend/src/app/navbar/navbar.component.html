<p-toolbar>
  <ng-template pTemplate="start">
    <button pButton type="button" label="Events Portal" icon="pi pi-calendar" [routerLink]="['/']"></button>
  </ng-template>

  <ng-template pTemplate="end">
    @if (!isLoggedIn()) {
      <button
        pButton
        type="button"
        label="Login"
        icon="pi pi-sign-in"
        [routerLink]="['/login']">
      </button>
    }

    @if (isLoggedIn()) {
      <button
        pButton
        type="button"
        label="Logout"
        icon="pi pi-sign-out"
        (click)="logout()">
      </button>
    }

    @if (isAdmin()) {
      <button
        pButton
        type="button"
        label="Admin"
        icon="pi pi-shield"
        [routerLink]="['/admin/events/new']">
      </button>
    }


  </ng-template>
</p-toolbar>
